<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Jamari Benologa</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">

    <!-- Visitor analytics: count broken links as /404/<path> so they show up in GoatCounter. -->
    <script>window.goatcounter = { path: function (p) { return '/404' + p; } };</script>
    <script data-goatcounter="https://askew.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

    <style>
        :root {
            --win-bg: rgba(248, 246, 251, 0.92);
            --titlebar: rgba(240, 236, 246, 0.95);
            --text: #1d1b22;
            --muted: #6c6677;
            --line: rgba(0, 0, 0, 0.08);
            --accent: #8b4fd8;
            --accent-text: #fff;
            --btn-bg: #fff;
            --btn-border: rgba(0, 0, 0, 0.14);
            --btn-hover: #f3eff9;
            --term-bg: #16131d;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --win-bg: rgba(34, 30, 42, 0.9);
                --titlebar: rgba(46, 40, 56, 0.95);
                --text: #ece8f2;
                --muted: #a39cb0;
                --line: rgba(255, 255, 255, 0.08);
                --accent: #b98ae6;
                --accent-text: #1a1320;
                --btn-bg: rgba(255, 255, 255, 0.08);
                --btn-border: rgba(255, 255, 255, 0.14);
                --btn-hover: rgba(255, 255, 255, 0.14);
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px 16px;
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
            color: var(--text);
            background:
                radial-gradient(55% 65% at 12% 18%, rgba(214, 160, 236, 0.85), transparent 62%),
                radial-gradient(50% 60% at 88% 22%, rgba(118, 88, 255, 0.75), transparent 62%),
                radial-gradient(65% 55% at 72% 92%, rgba(255, 138, 190, 0.55), transparent 62%),
                radial-gradient(60% 60% at 18% 96%, rgba(58, 38, 140, 0.9), transparent 62%),
                linear-gradient(160deg, #3b1d66, #1c1034);
            background-attachment: fixed;
        }
        .window {
            width: min(520px, 100%);
            border-radius: 12px;
            overflow: hidden;
            background: var(--win-bg);
            -webkit-backdrop-filter: blur(28px) saturate(1.5);
            backdrop-filter: blur(28px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 24px 64px rgba(24, 10, 48, 0.45);
        }
        .titlebar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            height: 40px;
            padding: 0 12px;
            background: var(--titlebar);
            border-bottom: 1px solid var(--line);
        }
        .lights { display: flex; gap: 8px; }
        .lights span { width: 13px; height: 13px; border-radius: 50%; background: #cdcad2; }
        .lights span:first-child { background: #ff5f57; }
        .titlebar h1 { grid-column: 2; margin: 0; font-size: 13px; font-weight: 600; }
        .body { padding: 28px 28px 30px; text-align: center; }
        .icon {
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: linear-gradient(145deg, #ffb36b, #e5484d);
            color: #fff;
            box-shadow: 0 6px 16px rgba(229, 72, 77, 0.35);
        }
        .icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        h2 { margin: 16px 0 6px; font-size: 22px; letter-spacing: -0.01em; }
        p { margin: 0 auto; max-width: 380px; color: var(--muted); }
        .term {
            margin: 18px 0 0;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--term-bg);
            color: #e6e1ee;
            font: 13px/1.5 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
            text-align: left;
            overflow-wrap: anywhere;
        }
        .term .prompt { color: #7ee2a8; }
        .term .err { color: #ff8a8a; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
        .btn {
            display: inline-flex;
            align-items: center;
            min-height: 36px;
            padding: 6px 16px;
            border: 1px solid var(--btn-border);
            border-radius: 8px;
            background: var(--btn-bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
        }
        .btn:hover { background: var(--btn-hover); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
        .btn.primary:hover { filter: brightness(1.08); }
        .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <main class="window" role="alertdialog" aria-labelledby="title" aria-describedby="desc">
        <div class="titlebar">
            <div class="lights" aria-hidden="true"><span></span><span></span><span></span></div>
            <h1>Error</h1>
        </div>
        <div class="body">
            <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3.5 21.5 20h-19z"/><path d="M12 10v4.5M12 17.2v.01"/></svg>
            </span>
            <h2 id="title">404: Page not found</h2>
            <p id="desc">The address might be mistyped, or the page may have moved.</p>
            <div class="term" aria-hidden="true">
                <span class="prompt">visitor@jamari ~ %</span> open <span id="path">/</span><br>
                <span class="err">open: no such file or directory</span>
            </div>
            <div class="actions">
                <a class="btn primary" href="/">Go to homepage</a>
                <a class="btn" href="/desktop/">Open desktop mode</a>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('path').textContent = window.location.pathname;
    </script>
</body>
</html>
